name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Compiles the mod and runs the parity tests against vanilla 1.21.1 and every standalone suite.
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: seedatlas-xaero
          path: build/libs/*-neoforge.jar
          if-no-files-found: error

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fetches the pinned engine, applies the 1.21.1 patches (fails if they no longer apply) and runs the C tests.
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
