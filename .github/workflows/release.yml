name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version}" >&2
            exit 1
          fi
      - run: ./gradlew build --console=plain
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Release notes are the CHANGELOG.md section for this version.
          awk -v v="$version" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" build/libs/seedatlas-xaero-${version}-mc1.21.1-neoforge.jar \
            --title "Seed Atlas ${version} for 1.21.1 NeoForge" --notes-file notes.md
